[project]
name = "yaaba"
version = "0.1.0"
description = "Training and evaluation code for yaaba-4B, a 4B LLM extended to Mooré"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

# What the local scripts and tests need. Training and measurement run on a GPU
# runtime (Colab A100), which installs torch, transformers and peft itself.
dependencies = [
  "boto3>=1.34",
  "datasets>=3.4",
  "huggingface-hub>=0.30",
  "pyarrow>=16.0",
]

[dependency-groups]
dev = [
  "matplotlib>=3.8",
  "pytest>=7.4",
  "ruff>=0.6",
  "sacrebleu>=2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts/train", "scripts/measure"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The scripts set `sys.path` before importing their neighbours.
"scripts/**/*.py" = ["E402"]
